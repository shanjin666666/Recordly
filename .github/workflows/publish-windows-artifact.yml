name: Publish verified platform artifact

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform artifact to publish
        required: true
        default: windows-x64
        type: choice
        options:
          - windows-x64
          - macos-arm64
          - macos-x64
          - linux-x64
      tag:
        description: Existing release tag
        required: true
        type: string
      run_id:
        description: Successful Build Electron App run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PLATFORM: ${{ inputs.platform }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify build source matches release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh release view "$RELEASE_TAG" >/dev/null
          RUN_JSON=$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID")
          test "$(jq -r .conclusion <<< "$RUN_JSON")" = success
          test "$(jq -r .path <<< "$RUN_JSON")" = .github/workflows/build.yml
          SOURCE_SHA=$(jq -r .head_sha <<< "$RUN_JSON")
          git cat-file -e "$RELEASE_TAG^{commit}"
          git diff --exit-code "$SOURCE_SHA" "$RELEASE_TAG" -- . ':(exclude).github/workflows/**'
          PACKAGE_VERSION=$(git show "$RELEASE_TAG:package.json" | jq -r .version)
          test "v$PACKAGE_VERSION" = "$RELEASE_TAG"
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.platform }}-release
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
      - name: Verify checksums and publish
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            windows-x64) CHECKSUMS=SHA256SUMS-windows.txt; test -s Recordly-windows-x64.exe ;;
            linux-x64) CHECKSUMS=SHA256SUMS-linux.txt; compgen -G '*.AppImage' >/dev/null ;;
            macos-arm64|macos-x64) CHECKSUMS="SHA256SUMS-$PLATFORM.txt"; compgen -G '*.dmg' >/dev/null; compgen -G '*.zip' >/dev/null ;;
            *) exit 1 ;;
          esac
          sha256sum --check "$CHECKSUMS"
          # Keep architecture-specific update metadata from overwriting each other.
          if [[ "$PLATFORM" == macos-* && -f latest-mac.yml ]]; then
            METADATA="latest-mac-${PLATFORM#macos-}.yml"
            mv latest-mac.yml "$METADATA"
            sed -i "s/  latest-mac.yml$/  $METADATA/" "$CHECKSUMS"
            sha256sum --check "$CHECKSUMS"
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
